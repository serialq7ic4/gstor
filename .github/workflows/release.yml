name: Release

on:
  release:
    types: [created]

permissions:
  contents: write

jobs:
  releases-matrix:
    name: Release Go Binary
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux]
        goarch: [amd64, arm64]
    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version-file: go.mod

    - name: Set version info
      id: version
      run: |
        VERSION=${GITHUB_REF#refs/tags/}
        if [ "$VERSION" = "$GITHUB_REF" ]; then
          VERSION="dev"
        fi
        echo "version=$VERSION" >> "$GITHUB_OUTPUT"
        echo "build_time=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> "$GITHUB_OUTPUT"
        echo "git_commit=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

    - name: Build static binary
      run: |
        package_dir="dist/gstor-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
        mkdir -p "$package_dir"
        CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -trimpath -ldflags "-s -w -X github.com/chenq7an/gstor/cmd.Version=${{ steps.version.outputs.version }} -X github.com/chenq7an/gstor/cmd.BuildTime=${{ steps.version.outputs.build_time }} -X github.com/chenq7an/gstor/cmd.GitCommit=${{ steps.version.outputs.git_commit }}" -o "$package_dir/gstor" .
        cp LICENSE README.md "$package_dir/"

    - name: Verify static Linux amd64 binary
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        package_dir="dist/gstor-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
        file "$package_dir/gstor"
        ldd "$package_dir/gstor" 2>&1 | tee /tmp/gstor-ldd.txt
        grep -q "not a dynamic executable" /tmp/gstor-ldd.txt

    - name: Package
      run: |
        package_name="gstor-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
        tar -C dist -czf "${package_name}.tar.gz" "$package_name"
        md5sum "${package_name}.tar.gz" > "${package_name}.tar.gz.md5"

    - name: Upload assets
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        package_name="gstor-${{ steps.version.outputs.version }}-${{ matrix.goos }}-${{ matrix.goarch }}"
        gh release upload "${{ steps.version.outputs.version }}" "${package_name}.tar.gz" "${package_name}.tar.gz.md5" --clobber
